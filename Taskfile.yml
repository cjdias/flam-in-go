version: "3"

vars:
  TOOLS: go tool -modfile=tools/go.mod

tasks:
  default:
    desc: List the tasks
    cmds:
      - task --list
    silent: true

  check:
    desc: Run every check, as the CI does
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: staticcheck
      - task: vuln
      - task: cover

  fmt:
    desc: Fail on the files gofmt would change
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then echo "not formatted:"; echo "$files"; exit 1; fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint, configured by .golangci.yml
    cmds:
      - golangci-lint run ./...

  staticcheck:
    desc: Run staticcheck, pinned by the tools module
    cmds:
      - "{{.TOOLS}} staticcheck ./..."

  vuln:
    desc: Scan the dependencies for the vulnerabilities the code reaches
    cmds:
      - "{{.TOOLS}} govulncheck ./..."

  test:
    desc: Run the tests with the race detector
    cmds:
      - go test -race ./...

  cover:
    desc: Run the tests with the race detector, failing below 100% coverage of pkg
    cmds:
      - go test -race -coverpkg=./pkg/... -coverprofile=coverage.out ./...
      - |
        missing=$(go tool cover -func=coverage.out | grep -v '100.0%' || true)
        if [ -n "$missing" ]; then echo "not fully covered:"; echo "$missing"; exit 1; fi

  cover:html:
    desc: Open the coverage report in a browser
    deps: [cover]
    cmds:
      - go tool cover -html=coverage.out

  tidy:
    desc: Tidy the module and the tools module
    cmds:
      - go mod tidy
      - go -C tools mod tidy
